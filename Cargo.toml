[workspace]
resolver = "2"
members = [
    "crates/wexo-core",
    "crates/wexo-sysinfo",
    "crates/wexo-optimizer",
    "crates/wexo-safety",
    "crates/wexo-rules",
    "crates/wexo-monitor",
    "crates/wexo-tools",
    "src-tauri",
]

[workspace.package]
version = "0.3.2"
edition = "2021"
license = "MIT"
rust-version = "1.78"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
ts-rs = "10"
wexo-core = { path = "crates/wexo-core" }
wexo-sysinfo = { path = "crates/wexo-sysinfo" }
wexo-optimizer = { path = "crates/wexo-optimizer" }
wexo-safety = { path = "crates/wexo-safety" }
wexo-rules = { path = "crates/wexo-rules" }
wexo-monitor = { path = "crates/wexo-monitor" }
wexo-tools = { path = "crates/wexo-tools" }

[profile.dev]
incremental = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
