[package]
name = "wexo-optimizer"
description = "Optimization registry and atomic apply/verify/rollback engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
wexo-core = { workspace = true }
wexo-safety = { workspace = true }
wexo-sysinfo = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
winreg = "0.11"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3"