[package]
name = "wexo-app"
description = "Wexo Optimizer desktop shell"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "wexo_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tempfile = "3"
wexo-core = { workspace = true }
wexo-sysinfo = { workspace = true }
wexo-optimizer = { workspace = true }
wexo-safety = { workspace = true }
wexo-rules = { workspace = true }
wexo-monitor = { workspace = true }
wexo-tools = { workspace = true }
