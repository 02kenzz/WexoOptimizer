name: Release Build & Sign

on:
  push:
    tags:
      - 'v*'           # Dispara al hacer: git tag v1.0.0 && git push --tags
  workflow_dispatch:   # Permite ejecutarlo manual desde la web de GitHub

permissions:
  contents: write      # Necesario para crear el Release y subir archivos

jobs:
  build-windows:
    name: Build Windows (signed)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # 1. Bajamos el código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Rust toolchain
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      # 3. Cache de cargo (acelera builds siguientes)
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      # 4. Node.js + cache de npm
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # 5. Instalamos dependencias frontend
      - name: Install frontend deps
        run: npm ci

      # 6. Build Tauri (compila Rust + Vite + genera instalador NSIS)
      - name: Build Tauri app
        run: npm run tauri build
        env:
          # Tauri 2 usa estas vars para versión
          TAURI_VERSION: ${{ github.ref_name }}

      # 7. Firmamos el .exe del instalador NSIS (requiere certificado en Secrets)
      - name: Sign installer
        if: env.CERT_PFX_BASE64 != ''
        uses: microsoft/signtool@v1
        with:
          cert: ${{ secrets.CERT_PFX_BASE64 }}
          pwd: ${{ secrets.CERT_PASSWORD }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
          timestamp: http://timestamp.sectigo.com
          # Opcional: description / description-url para que salga en UAC
          # description: "Wexo Optimizer"
          # description-url: "https://github.com/${{ github.repository }}"

      # 8. Subimos artefactos (por si falla la release)
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wexo-optimizer-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

      # 9. Creamos Release en GitHub y adjuntamos el .exe
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: Wexo Optimizer ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe