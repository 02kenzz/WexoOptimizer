name: Release Build & Sign

on:
  push:
    tags:
      - 'v*'           # Dispara al hacer: git tag v1.0.0 && git push --tags
  workflow_dispatch:   # Permite ejecutarlo manual desde la web de GitHub

permissions:
  contents: write      # Necesario para crear el Release y subir archivos

jobs:
  build-windows:
    name: Build Windows (signed)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # 1. Bajamos el código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Rust toolchain
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      # 3. Cache de cargo (acelera builds siguientes)
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      # 4. Node.js + cache de npm
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # 5. Instalamos dependencias frontend
      - name: Install frontend deps
        run: npm ci

      # 6. Build Tauri (compila Rust + Vite + genera instalador NSIS)
      - name: Build Tauri app
        run: npm run tauri build
        env:
          # Tauri 2 usa estas vars para versión
          TAURI_VERSION: ${{ github.ref_name }}

      # 7. Firmamos el .exe del instalador NSIS (requiere certificado en Secrets)
      - name: Sign installer
        if: env.CERT_PFX_BASE64 != ''
        shell: powershell
        run: |
          $certPath = "$env:TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String("${{ secrets.CERT_PFX_BASE64 }}"))
          $signtool = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe"
          if (-not (Test-Path $signtool)) {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" | Select-Object -First 1 -ExpandProperty FullName
          }
          & $signtool sign /f $certPath /p "${{ secrets.CERT_PASSWORD }}" /tr http://timestamp.sectigo.com /td sha256 /fd sha256 "target/release/bundle/nsis/*.exe"
          Remove-Item $certPath -Force

      # 8. Subimos artefactos (por si falla la release)
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wexo-optimizer-installer
          path: target/release/bundle/nsis/*.exe
          retention-days: 30

      # 9. Creamos Release en GitHub y adjuntamos el .exe
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: Wexo Optimizer ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            target/release/bundle/nsis/*.exe